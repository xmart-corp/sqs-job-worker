name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Check tag matches the project version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Requires a trusted publisher configured on PyPI for this repository,
    # workflow, and the "pypi" environment (no API token is stored).
    environment:
      name: pypi
      url: https://pypi.org/project/sqs-job-worker/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
