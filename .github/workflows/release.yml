name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.0

      - name: Check tag matches the project version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Requires a trusted publisher configured on PyPI for this repository,
    # workflow, and the "pypi" environment (no API token is stored).
    environment:
      name: pypi
      url: https://pypi.org/project/sqs-job-worker/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract this version's notes from the changelog
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            found && /^## \[/ { exit }
            found { print }
            $0 ~ "^## \\[" ver "\\]" { found = 1 }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
